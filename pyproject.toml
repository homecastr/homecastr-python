[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homecastr"
version = "0.2.0"
description = "Python SDK for the Homecastr and Worldcastr forecast API surfaces"
readme = "README.md"
license = "MIT"
authors = [{ name = "Homecastr", email = "api@homecastr.com" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-httpx>=0.30.0", "ruff>=0.4.0"]
notebooks = ["jupyter>=1.0.0", "matplotlib>=3.8.0", "h3>=4.0.0"]

[project.urls]
Homepage = "https://www.homecastr.com"
Repository = "https://github.com/homecastr/homecastr-python"
Documentation = "https://docs.homecastr.com"
Worldcastr = "https://worldcastr.com"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.setuptools.packages.find]
include = ["homecastr*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
